[project]
name = "tinkerbox-ane"
version = "1.0.0"
description = "LiquidAI d1-3B decision model on the Apple Neural Engine via Core AI"
readme = "README.md"
license-files = ["LICENSES/*.txt", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.9.0",
    "transformers==5.19.0",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "numpy==2.4.6",
]

[project.urls]
Homepage = "https://github.com/WeGoToMars/tinkerbox"
Issues = "https://github.com/WeGoToMars/tinkerbox/issues"

[dependency-groups]
dev = ["coreai-torch==0.4.3", "pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinkerbox_ane"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/tinkerbox_ane/d1/host.swift" },
    { file = "src/tinkerbox_ane/d1/cow-staging.m" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
