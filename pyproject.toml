[project]
name = "tinkerbox-ane"
version = "2.2.0"
description = "Optimized AI model runtime for practical tasks on Apple Neural Engine."
readme = "README.md"
license-files = ["LICENSES/*.txt", "NOTICE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==5.19.0",
    "huggingface-hub==2.2.0",
    "safetensors==0.8.0",
    "numpy==2.4.6",
    "pillow>=10.0.0",
]


[project.urls]
Homepage = "https://github.com/WeGoToMars/tinkerbox"
Issues = "https://github.com/WeGoToMars/tinkerbox/issues"

[project.optional-dependencies]
speech = ["omnivoice==0.2.1", "torchaudio==2.9.0", "pydantic>=2,<3"]

[dependency-groups]
dev = [
    "accelerate>=1.15.0",
    "coreai-opt[coreai]==0.3.0",
    "torchao==0.15.0",
    "coreai-torch==0.4.3",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinkerbox_ane"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/tinkerbox_ane/*.swift" },
    { file = "src/tinkerbox_ane/cow-staging.m" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
